<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<section  class="contact section"  id="contact">
<div  class="contact__container  grid" id="">
  <div  class="contact__data">
<h2  class="section__title-1">
  <span >Contact Me.</span>
</h2>
    <p  class="contact__description-1">
i will read all emails.Send me any message you want and i will back to you.
    </p>
    <p  class="contact__description-2">
I need your <b>Name</b> and <b>Email Address</b>,but you will not receive anything other than your replay.
    </p>
    <div  class="geometric-box"></div>
  </div>
  <div class="contact__mail">
    <h2  class="contact__title">
      Send Me a Message
    </h2>

    <form  class="contact__form">
      <div  class="contact__group">
<div  class="contact__box">
  <input  type="text" name="user_name" class="contact__input"  required  placeholder="First Name"  id="name"  >
  <label  for="name"  class="contact__label"></label>
</div>
        <div  class="contact__box">
          <input  type="email" name="user_email" class="contact__input"  required  placeholder="Email Address"  id="email"  >
          <label  for="email" class="contact__label"  ></label>
        </div>
        <div  class="contact__box">
          <input  type="text" name="user_subject" class="contact__input"  required  placeholder="Subject"  id="subject"  >
          <label  for="subject" class="contact__label"></label>
        </div>
        <div class="contact__box contact__area">
          <textarea name="user__message" id="message" class="contact__input" required placeholder="Message"></textarea>
          <label for="message" class="contact__label"></label>
        </div>
        <button   type="submit"  class="contact__button button">
          <i class="ri-send-plane-line"></i>Send  Message
        </button>

      </div>
    </form>
  </div>
  <div  class="contact__social">
    <img  src="img/curved-arrow.svg"  class="contact__social-arrow">
    <div  class="contact__social-data">
      <div>
        <p  class="contact__social-description-1">
         Does not send emails
        </p>
        <p  class="contact__social-description-1">
         write me on my social network
        </p>
      </div>
      <div class="contact__social-links">
        <a href="https://www.linkedin.com/in/sohaila-walid-25a817313" target="_blank" class="contact__social_link"><i class="ri-linkedin-box-fill"></i></a>
        <a href="https://www.linkedin.com/in/sohaila-walid-25a817313" target="_blank" class="contact__social_link"><i class="ri-facebook-circle-fill"></i></a>
        <a href="https://www.instagram.com/yourusername/" target="_blank" class="contact__social_link">
          <i class="ri-instagram-fill"></i>
        </a>
      </div>
    </div>
  </div>
</div>
</section>







<script src="js/app.js"></script>
</body>
</html>
