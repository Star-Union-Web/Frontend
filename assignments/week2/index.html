<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Card</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="card_container">
  <div class="image">
    <img src="img/me.png">
  </div>

  <div class="text">
    <h2 class="name">Sohila Walid</h2>
    <p class="jop">Front-End Developer</p>
  </div>

  <!-- Social Icons -->
  <div class="social">
    <a href="https://www.linkedin.com" target="_blank" class="linkedin"><i class='bx bxl-linkedin'></i></a>
    <a href="https://www.facebook.com" target="_blank" class="facebook"><i class='bx bxl-facebook'></i></a>
    <a href="https://www.github.com" target="_blank" class="github"><i class='bx bxl-github'></i></a>
  </div>

  <!-- Buttons Section -->
  <div class="buttons">
    <button class="subscribe">Subscribe</button>
    <button class="message">Message</button>
  </div>



  <div class="analytics">
    <div class="data">
      <i class='bx bx-share'></i>
      <span>12</span>
    </div>
    <div class="data">
      <i class='bx bx-heart'></i>
      <span>25</span>
    </div>
    <div class="data">
      <i class='bx bx-comment'></i>
      <span>8</span>
    </div>
  </div>

</div>

</body>

</html>
