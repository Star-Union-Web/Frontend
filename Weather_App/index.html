<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/output.css" rel="stylesheet">
    <title>Weather.Now</title>
    <style>
        #weather-BG {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            display: flex;
        }
        .right-side {
            width: 35%;
            height: 100%;
            padding: 2rem;
            box-shadow: -1px 0px 10px 0px rgba(0,0,0,0.1);
            background: rgba(36, 34, 34, 0.637);
        }
        .left-side {
            width: 35%;
            height: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .weather-right-section {
            display: flex;
            flex-direction: column;
            padding: 2rem;
            border-radius: 10px;
            background-color: rgba(36, 34, 34, 0.637);
        }
    </style>
</head>
<body id="weather-BG" class="font-sans flex justify-between">
        <!-- left side -->
        <div class="left-side flex flex-col justify-between p-8">
            <!-- App name -->
            <h1 class="text-xl font-bold text-white">Weather.Now</h1>
            <!-- Weather Info -->
            <div class="text-white weather-right-section">
                <div class="flex items-center mb-1">
                  <img alt="Weather Icon" class="w-11 h-11" id="weather-icon"/>
                    <p class="text-4xl ml-2" id="Temperature"></p>
                </div>
                <h2 class="text-2xl" id="city-name"></h2>
                <p class="text-sm mt-2" id="date"></p>
                <p class="text-lg mt-2" id="condition"></p>
            </div>
        </div>

        <!-- right side -->
        <div class="right-side p-9 bg-opacity-50 space-y-9">
            <!-- Search Bar -->
            <div class="mb-6">
                <input type="text" id="city-input" placeholder="Location" class="w-3/4 p-2 rounded bg-opacity-50 backdrop-blur-md placeholder-gray-400 focus:outline-none text-black" />
                <button onclick="fetchWeather()" id="search-btn" class="w-1/5 mt-2 py-2 bg-blue-500 hover:bg-blue-600 rounded">Search</button>
            </div>
            <!-- Weather Details -->
            <div class=" gap-1 flex flex-col">
                <h2 class="text-2xl mb-3 text-white">Weather Details</h2>
                <h2 id="city-name-d" class="text-gray-300"></h2>
                <div class= "flex justify-between text-gray-300">
                    <p>Temperature </p>
                    <p id="temp"></p>
                </div>
                <div class= "flex justify-between text-gray-300">
                    <p>cloudy </p>
                    <p id="cloudy"></p>
                </div>
                <div class= "flex justify-between text-gray-300">
                    <p>Humidity </p>
                    <p id="humidity"></p>
                </div>
                <div class= "flex justify-between text-gray-300">
                    <p>Wind</p>
                    <p id="wind-speed"></p>
                </div>  
            </div>
            <!-- break line -->
            <hr class="border-gray-300"/>
            <!-- 5 day Forecast -->
            <div id="forecast-container" class="w-full flex justify-around items-end h-64 mt-4 text-white">
              

            </div>

        </div>


    <script src="src/js/app.js"></script>
</body>
</html>
