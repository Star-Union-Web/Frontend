<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="dist/output.css" rel="stylesheet">
    <title>Weather.Now</title>
    <style>
        #weather-BG {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
        }
        h1 {
            color: #fff;
        }
        body{
            color: #fff;
        }
    </style>
</head>
<body id="weather-BG"  class="font-sans flex items-center justify-center h-screen text-white">
    <!-- Main Container -->
    <div class="w-full max-w-6xl grid grid-cols-2  rounded-lg overflow-hidden shadow-lg">
        <!-- left side -->
        <div class="flex flex-col justify-between p-8 bg-opacity-50">
            <!-- App name -->
            <h1 class="text-4xl font-bold text-white">Weather.Now</h1>
            <!-- Weather Info -->
            <div>
                <div class="flex items-center space-x-4 mb-2">
                  <img alt="Weather Icon" class="w-16 h-16" id="weather-icon"/>
                  <p class="text-5xl font-bold" id="temperature"></p>
                </div>
                <h2 class="text-2xl" id="city-name"></h2>
                <p class="text-sm mt-2" id="date"></p>
                <p class="text-lg mt-2" id="condition"></p>
            </div>
        </div>

        <!-- right side -->
        <div class="p-9">
            <!-- Search Bar -->
             <div class="mb-6">
                <input type="text" id="city-input" placeholder="Location" class="w-full p-6 rounded bg-black bg-opacity-50 backdrop-blur-md placeholder-gray-400 focus:outline-none" />
                <button onclick="fetchWeather()" id="search-btn" class="w-full mt-2 py-2 bg-blue-500 hover:bg-blue-600 rounded">Search</button>
            </div>
            <!-- Weather Details -->
            <div class=" gap-4">
                <h2 id="city-name"></h2>
                <p id="temperature"></p>
                <p id="condition"></p>
                <p id="humidity"></p>
                <p id="wind-speed"></p>
            </div>
            <!-- 5 Day Temperature -->
            <div class="mt-6">
                <h3 class="text-lg">5 Day Forecast</h3>
                <div class="grid grid-cols-5 gap-4 mt-2" id="forecast">
                    <!-- Forecast Data -->
                    
                </div>
            </div>
        </div>
    </div>
    
    <script src="src/js/app.js"></script>
</body>
</html>
